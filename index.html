<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        body { 
            margin: 0; 
            background: black; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }
        video { 
            width: 100%; 
            max-height: 100vh; 
        }
    </style>
</head>
<body>

    <!-- autoplay, muted, and playsinline bypass mobile restrictions -->
    <video autoplay muted playsinline controls>
        <source src="istvan.mp4" type="video/mp4">
        Valami gaty
    </video>

</body>
</html>
