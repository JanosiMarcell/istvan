<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc Pista Video</title>
    <style>
        body { 
            margin: 0; 
            background: black; 
            height: 100vh; 
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #splash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        #splash-text {
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        #play-btn {
            background: #ff0000; 
            color: white;
            border: none;
            padding: 18px 36px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255,0,0,0.4);
        }
        #myVideo { 
            position: fixed;
            top: 0; left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1; 
        }
    </style>
</head>
<body>

    <div id="splash-overlay">
        <div id="splash-text">Mc Pista mondani akar neked valamit</div>
        <button id="play-btn">▶ Lejátszás</button>
    </div>

    <video id="myVideo" playsinline controls>
        <source src="istvan.mp4" type="video/mp4">
        Valami gaty
    </video>

    <script>
        document.getElementById('play-btn').addEventListener('click', function() {
            var splash = document.getElementById('splash-overlay');
            var video = document.getElementById('myVideo');

            splash.style.display = 'none';
            video.play();

            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            }
        });
    </script>

</body>
</html>
